<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="regeln.pageTitle">Mamal-Trading · Die Regeln</title>
<style>
  :root{ --txt:#1d1d1f; --txt2:#6e6e73; --txt3:#86868b; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.05);
    --card:#fff; --card2:#f6f8fb; --bg:#fbfbfd;
    --green:#0a7d3c; --green-bg:#e8f6ee; --red:#d70015; --red-bg:#fdeceb;
    --amber:#9a5b00; --amber-bg:#fdf3e3; --accent:#0071e3; --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Cascadia Mono',Consolas,monospace; }
  :root[data-theme="dark"]{ --txt:#f5f5f7; --txt2:#a1a1a6; --txt3:#8e8e93; --line:rgba(255,255,255,.12);
    --line2:rgba(255,255,255,.07); --card:#1c1c1e; --card2:#242428; --bg:#000;
    --green:#30d158; --green-bg:#17301f; --red:#ff453a; --red-bg:#331a19;
    --amber:#ffb340; --amber-bg:#332713; --shadow:none; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:820px;margin:0 auto;padding:22px 22px 80px}
  .back{margin-bottom:18px}
  .back a{color:var(--accent);text-decoration:none;font-size:13px}
  h1{font-size:25px;margin:0 0 6px;letter-spacing:-.01em}
  .lead{color:var(--txt2);margin:0 0 4px}
  h2{font-size:12px;letter-spacing:.12em;color:var(--txt3);text-transform:uppercase;
    margin:34px 0 12px;border-bottom:1px solid var(--line);padding-bottom:7px}

  /* Die gelebte Einstellung, nicht die aufgeschriebene */
  .konfig{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:15px 17px;margin-top:16px}
  .konfig .kz{font-size:12.5px;color:var(--txt2);margin-bottom:10px}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
  .kitem .l{font-size:10.5px;letter-spacing:.06em;color:var(--txt3);text-transform:uppercase}
  .kitem .v{font:600 15px/1.3 var(--mono)}

  /* Eine Regel */
  .regel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
  .regel.aus{opacity:.62}
  .rkopf{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .rid{font:700 11.5px/1 var(--mono);color:var(--txt3);background:var(--card2);
    border:1px solid var(--line);border-radius:6px;padding:4px 7px}
  .rname{font-size:16.5px;font-weight:650;letter-spacing:-.01em}
  .rzustand{margin-inline-start:auto;font-size:11px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .z-an{background:var(--green-bg);color:var(--green)}
  .z-aus{background:var(--card2);color:var(--txt3)}
  .z-opt{background:var(--amber-bg);color:var(--amber)}
  .rwas{margin:0 0 9px}
  .rbsp{font-size:13.5px;color:var(--txt2);background:var(--card2);border-radius:10px;
    padding:9px 12px;border-inline-start:3px solid var(--line)}
  .rbsp b{color:var(--txt)}
  .rwert{margin-top:9px;font:600 13px/1.4 var(--mono);color:var(--accent)}
  .rwert .um{color:var(--txt3);font-weight:500}

  .hinweis{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;color:var(--txt2);font-size:13.5px;margin-top:10px}
  .hinweis b{color:var(--txt)}
  .hinweis ul{margin:8px 0 0;padding-inline-start:20px}
  .hinweis li{margin-bottom:5px}

  .lang{position:fixed;top:14px;inset-inline-end:14px;background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:5px 9px;font:inherit;font-size:13px;
    color:var(--txt);cursor:pointer;box-shadow:var(--shadow)}

  /* Rechts-nach-links (Persisch). Siehe die gleichlautenden Bloecke der uebrigen
     Seiten: Zahlen muessen links-nach-rechts bleiben, sonst kippt ein Paar wie
     "3 / 5" und behauptet das Gegenteil. */
  html[dir="rtl"] .num,html[dir="rtl"] .mono,html[dir="rtl"] .kitem .v,
  html[dir="rtl"] .rid,html[dir="rtl"] .rwert{direction:ltr;unicode-bidi:isolate}

  @media (max-width:560px){
    .wrap{padding-left:13px;padding-right:13px}
    h1{font-size:21px}
  }
  @media print{ .lang,.back{display:none} body{background:#fff} .regel{break-inside:avoid} }
</style>
</head>
<body>
<select id="langSel" class="lang" title="Sprache / Language / زبان">
  <option value="de">DE</option><option value="en">EN</option><option value="fa">فا</option>
</select>
<div class="wrap">
  <div class="back"><a href="/" data-i18n="nav.back">← zurück zum Cockpit</a></div>

  <h1 data-i18n="regeln.h1">Die Regeln in einfacher Sprache</h1>
  <p class="lead" data-i18n="regeln.lead">Kein Fachwissen nötig.</p>

  <div class="konfig">
    <div class="kz" id="konfigZeile">…</div>
    <div class="kgrid" id="konfigGrid"></div>
  </div>

  <h2 data-i18n="regeln.h2.alle">Jede Regel einzeln</h2>
  <div id="liste"></div>

  <h2 data-i18n="regeln.h2.grenzen">Was das Werkzeug nicht kann</h2>
  <div class="hinweis" id="grenzen"></div>
</div>

<script src="/i18n.js"></script>
<script src="/regeln.js"></script>
<script src="/i18napply.js"></script>
<script>
// ==== v0.74: Die Regelseite ================================================
// Warum diese Seite die Werte LIVE aus dem EA liest und nicht aufschreibt:
//   docs/RULES-PLAIN.md rechnet durchgehend mit einem 20.000-Euro-Konto und
//   nennt darum "50 Euro Risiko pro Trade". Auf einem 10.000-Euro-Konto ist
//   jede dieser Euro-Zahlen falsch. Ein aufgeschriebener Wert veraltet in dem
//   Moment, in dem jemand eine Eingabe im EA aendert - und eine Regelseite,
//   die etwas anderes behauptet als das Werkzeug tut, ist schlimmer als keine.
//   Also: Prozentsaetze, Ein/Aus-Zustand und Kontogroesse kommen aus /state,
//   der erklaerende Text aus regeln.js. Der Text sagt, WAS die Regel tut; die
//   Zahl daneben sagt, WIE sie gerade eingestellt ist.
// Das ist zugleich die Vorarbeit fuer den spaeteren Wunsch, Regelwerte je
//   Monat setzen zu koennen: die Seite zeigt dann ohne Aenderung den Wert des
//   jeweiligen Monats an, weil sie ihn ohnehin erfragt statt ihn zu kennen.
const $ = id => document.getElementById(id);
const ESCMAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>ESCMAP[c]);

// Thema vom Dashboard uebernehmen
(function(){ const saved=localStorage.getItem('mamalTheme')
    ||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=saved; })();

// Der Regeltext liegt in regeln.js, nicht in i18n.js: er ist INHALT, nicht
//   Bedienoberflaeche, und wird nur von dieser einen Seite gebraucht. Ihn in
//   i18n.js zu legen hiesse, ihn mit jeder Dashboard-Ansicht mitzuladen.
function r(key){
  const T = window.MAMAL_REGELN||{};
  return (T[LANG]&&T[LANG][key]) || (T.de&&T.de[key]) || '';
}

const ACCT=new URLSearchParams(location.search).get('acct')||localStorage.getItem('mamalAcct')||'';
const AQ = ACCT ? ('?acct='+encodeURIComponent(ACCT)) : '';
let ST=null;

// Prozent in Euro umrechnen, damit die Regel greifbar wird. Bewusst gerundet
//   und als "rund" ausgewiesen: der EA rechnet im Ernstfall mit dem Kontostand
//   des Augenblicks, nicht mit dem von eben.
function eur(pct){
  const basis = (ST && (ST.initBal>0 ? ST.initBal : ST.equity)) || 0;
  if(!basis || pct==null) return '';
  const v = basis*pct/100;
  return r('wert.rund').replace('{x}', Math.round(v).toLocaleString(numLoc())+' €');
}

function zustand(id){
  const aus = (ST && ST.disabled) || [];
  if(aus.includes(id) || (id==='R15' && aus.includes('R15min'))) return 'aus';
  return REGEL_ZUSTAND[id] || 'an';
}

function renderKonfig(){
  $('konfigZeile').textContent = ST
    ? r('konfig.zeile').replace('{konto}', ST.account||'—').replace('{profil}', ST.profile||'—')
    : r('konfig.offline');
  if(!ST){ $('konfigGrid').innerHTML=''; return; }
  const felder = [
    ['konfig.risiko',  ST.riskPerTrade, '%'],
    ['konfig.tag',     ST.dailyLimit,   '%'],
    ['konfig.max',     ST.maxLoss,      '%'],
    ['konfig.woche',   ST.weekLimit,    '%'],
    ['konfig.ziel',    ST.targetPct,    '%'],
    ['konfig.gesamt',  ST.heatCap,      '%'],
  ];
  $('konfigGrid').innerHTML = felder.map(([k,v,e])=>
    `<div class="kitem"><div class="l">${esc(r(k))}</div>
      <div class="v">${v==null?'—':esc(String(v).replace('.',decSep())+e)}</div></div>`).join('');
}

function renderRegeln(){
  $('liste').innerHTML = REGEL_FOLGE.map(id=>{
    const z = zustand(id);
    const wert = REGEL_WERT[id] ? REGEL_WERT[id](ST) : '';
    return `<div class="regel ${z==='aus'?'aus':''}">
      <div class="rkopf">
        <span class="rid">${esc(id)}</span>
        <span class="rname">${esc(r('r.'+id+'.name'))}</span>
        <span class="rzustand z-${z==='aus'?'aus':z==='optional'?'opt':'an'}">${esc(r('zustand.'+z))}</span>
      </div>
      <p class="rwas">${r('r.'+id+'.was')}</p>
      ${r('r.'+id+'.bsp') ? `<div class="rbsp">${r('r.'+id+'.bsp')}</div>` : ''}
      ${wert ? `<div class="rwert">${wert}</div>` : ''}
    </div>`;
  }).join('');
}

function renderGrenzen(){
  const n = Number(r('grenzen.anzahl'))||0;
  let li='';
  for(let i=1;i<=n;i++) li += `<li>${r('grenzen.'+i)}</li>`;
  $('grenzen').innerHTML = `<b>${esc(r('grenzen.lead'))}</b><ul>${li}</ul>`;
}

// v0.74-fix: applyI18n() schlaegt data-i18n-Schluessel in i18n.js nach. Die
//   regeln.*-Schluessel liegen aber in regeln.js — es fand sie nicht und liess
//   den deutschen Ersatztext im HTML stehen. Ergebnis: die Ueberschrift blieb
//   in ALLEN Sprachen deutsch, waehrend darunter alles uebersetzt war. Also
//   nach applyI18n() ein zweiter Durchgang gegen die Inhaltstabelle.
function applyRegelTexte(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = r(el.dataset.i18n);
    if(v) el.textContent = v;          // keines dieser Elemente hat Kindknoten
  });
  const tt = r('regeln.pageTitle');
  if(tt) document.title = tt;
}

function alles(){ renderKonfig(); renderRegeln(); renderGrenzen(); applyI18n(); applyRegelTexte(); }

$('langSel').addEventListener('change', function(){
  LANG=this.value; try{ localStorage.setItem('mamalLang',LANG); }catch(e){}
  alles();
});

(async function(){
  try{
    const j = await (await fetch('/state'+AQ)).json();
    if(j && j.error==='auth'){ location.href='/login'; return; }
    ST = j.state || null;
  }catch(e){ ST = null; }
  $('langSel').value = LANG;
  alles();
})();
</script>
</body>
</html>
