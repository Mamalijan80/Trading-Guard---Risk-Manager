<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamal-Trading · Tag</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --card2:#fafafc;
    --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.05);
    --txt:#1d1d1f; --txt2:#6e6e73; --txt3:#86868b;
    --accent:#0071e3; --accent-bg:#e9f2fd;
    --green:#0a7d3c; --green-bg:#e9f7ef; --red:#d70015; --red-bg:#fdecea; --amber:#9a5b00; --amber-bg:#fff4e0;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Cascadia Mono',Consolas,monospace;
  }
  /* v0.39: Dark Mode — folgt der Wahl im Dashboard (localStorage mamalTheme) */
  html[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
    --txt:#f5f5f7; --txt2:#aeaeb2; --txt3:#8e8e93;
    --accent:#0a84ff; --accent-bg:#0a2642;
    --green:#30d158; --green-bg:#0d2a17; --red:#ff453a; --red-bg:#2e1413; --amber:#ff9f0a; --amber-bg:#2e2008;
    --shadow:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:22px 22px 70px}
  a{color:var(--accent);text-decoration:none;font-weight:600}
  .back{font-size:13px;color:var(--txt2)}
  .hero{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;border-top:3px solid var(--accent);display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .hero .day{font-size:22px;font-weight:700}.hero .day small{display:block;font-size:13px;color:var(--txt3);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  .hero .net{margin-left:auto;text-align:right}
  .hero .net .l{font-size:11px;letter-spacing:.1em;color:var(--txt3);text-transform:uppercase}
  .hero .net .v{font:700 30px/1 var(--mono)}
  .pos{color:var(--green)}.neg{color:var(--red)}.flat{color:var(--txt2)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}   /* v0.45: +manuell */
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:14px 16px}
  .kpi .l{font-size:11px;letter-spacing:.08em;color:var(--txt3);text-transform:uppercase}
  .kpi .v{font:700 24px/1.1 var(--mono);margin-top:3px}
  h2{font-size:13px;letter-spacing:.12em;color:var(--txt3);font-weight:700;margin:28px 4px 12px;text-transform:uppercase}
  .rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:14px 16px}
  .rcard .h{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .rid{font:700 11px/1 var(--mono);color:var(--accent);background:var(--accent-bg);border-radius:6px;padding:4px 6px}
  .rn{font-weight:600}.cnt{margin-left:auto;font:700 14px/1 var(--mono);color:var(--amber)}
  .rcard .ex{color:var(--txt2);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--txt3);font-weight:700;font-size:11px;letter-spacing:.06em;padding:11px 15px;border-bottom:1px solid var(--line);text-transform:uppercase}
  td{padding:10px 15px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:12.5px;color:var(--txt2)}
  tr:last-child td{border-bottom:0}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:700;font-size:11px}
  .bd-open{background:var(--accent-bg);color:#1e50c8}.bd-close{background:var(--line2);color:#3a4658}
  .bd-man{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}   /* v0.44: manueller Trade */
  .bd-block{background:var(--amber-bg);color:#a95e08}.bd-lock{background:var(--red-bg);color:#b42121}
  .bd-test{background:#eef1f6;color:#6b7688}.bd-prot{background:var(--red-bg);color:#b42121}
  .net-pos{color:var(--green)}.net-neg{color:var(--red)}
  /* v0.73: Schmale Schirme. Gemessen bei 375 px lief jede Seite ueber -
     auf Deutsch mehr als auf Persisch, es ist also kein RTL-Fehler. Auf
     Persisch faellt es nur auf, weil dort der Zeilenanfang abgeschnitten
     wird statt des Endes. Rand und Schriftgrad zurueck, breite Tabellen
     scrollbar: "einen Wisch entfernt" statt "weg". */
  @media (max-width:560px){
    .wrap{padding-left:13px;padding-right:13px}
    table{font-size:12px}
    .card{overflow-x:auto}
  }
  .empty{padding:24px;text-align:center;color:var(--txt3)}
  /* ==== v0.73: Rechts-nach-links (Persisch) ====
     Diese Seite hatte KEINE einzige RTL-Regel, obwohl applyI18n() ihr
     dir="rtl" setzt - die Sprache war da, das Layout nicht. Folge: Zahlen
     liefen im RTL-Fluss mit, und ein Gebilde aus zwei Zahlengruppen mit
     einem neutralen Trenner dazwischen kippt dabei. Aus "0 / 2" wurde auf
     dem Schirm "2 / 0" - im Wochen-Report waren alle vier Zeilen der Woche
     vertauscht, Siege als Niederlagen. Die Daten waren richtig, nur die
     Darstellung log.
     `isolate` statt `embed`: isolate kappt die Wechselwirkung mit dem
     umgebenden Text ganz, embed laesst sie teilweise zu. */
  html[dir="rtl"] table th,html[dir="rtl"] table td{text-align:right}
  html[dir="rtl"] .num,html[dir="rtl"] .mono,html[dir="rtl"] .v,
  html[dir="rtl"] .n,html[dir="rtl"] .cnt{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<div class="wrap">
  <div class="back"><a href="/" data-i18n="nav.back">← zurück zum Cockpit</a></div>
  <div class="hero">
    <div class="day"><small data-i18n="day.label">Handelstag</small><span id="dtitle">…</span></div>
    <div class="net"><div class="l" data-i18n="day.net">Netto an diesem Tag</div><div class="v" id="net">—</div></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l" data-i18n="day.kpi.trades">Trades</div><div class="v" id="k-trades">—</div></div>
    <div class="kpi"><div class="l" data-i18n="day.kpi.wins">Gewinne</div><div class="v pos" id="k-wins">—</div></div>
    <div class="kpi"><div class="l" data-i18n="day.kpi.losses">Verluste</div><div class="v neg" id="k-losses">—</div></div>
    <div class="kpi"><div class="l" data-i18n="day.kpi.blocks">Regel-Blocks</div><div class="v" id="k-blocks">—</div></div>
    <div class="kpi"><div class="l" data-i18n="day.kpi.manual">davon manuell</div><div class="v" id="k-manual">—</div></div>
  </div>

  <h2 id="rhead" style="display:none" data-i18n="day.h2.rules">Welche Regeln haben an diesem Tag gegriffen</h2>
  <div class="rules" id="rules"></div>

  <h2 data-i18n="day.h2.events">Was an diesem Tag passiert ist</h2>
  <div class="card"><table><thead><tr><th data-i18n="journal.th.time">Zeit</th><th data-i18n="journal.th.event">Ereignis</th><th data-i18n="journal.th.symbol">Symbol</th><th data-i18n="journal.th.net">Netto</th><th data-i18n="journal.th.reason">Grund / Tag</th></tr></thead>
    <tbody id="tl"><tr><td colspan="5" class="empty" data-i18n="journal.loading">lade…</td></tr></tbody></table></div>
</div>
<script src="/i18n.js"></script>
<script src="/i18napply.js"></script>
<script>
// v0.39: take over the theme from the dashboard
//   v0.73: `t` hier umbenannt -- i18napply.js bringt die Funktion t() mit,
//   und eine lokale Variable desselben Namens wuerde sie in diesem Block
//   verdecken ('t is not a function' statt Uebersetzung).
(function(){ const saved=localStorage.getItem('mamalTheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=saved; })();
const $=id=>document.getElementById(id);
const de=(n,d=2)=>(n==null||isNaN(n))?'—':Number(n).toFixed(d).replace('.',',');
// v0.73-fix: Der Betrag kommt schon isoliert zurueck (U+2066/U+2069,
//   unsichtbar, in LTR wirkungslos). Ohne das wanderte unter RTL das
//   Vorzeichen ans andere Ende, sobald der Behaelter nicht zufaellig von
//   der CSS-Regel erfasst war - derselbe Betrag sah auf einer Seite an
//   zwei Stellen verschieden aus.
const eur=v=>ltr((v>=0?'+':'−')+'€'+Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}));
// Defuse foreign text (broker symbols, free journal tags) before innerHTML.
const ESCMAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESCMAP[c]);
// v0.73: Diese Seite fuehrte eine EIGENE Regeltabelle. Ihre Formulierungen
//   wichen von der des Dashboards ab (R3 hier 'Tages-Risiko-Budget auf-
//   gebraucht', dort 'max. risk you may open per day') und sie trug dieselben
//   englischen Einsprengsel (R16, R17, R22). Zwei Tabellen fuer dieselbe Sache
//   heisst: jede Korrektur muss man zweimal machen, und beim zweiten Mal
//   vergisst es jemand. Jetzt beide aus rules.<id>.name/.sub.
const ruleMeta = id => [ t('rules.'+id+'.name') || id, t('rules.'+id+'.sub') || '' ];
const monShort = () => t('calendar.months.short').split(',');
function fmtDay(d){ const p=d.split('.'); if(p.length!==3)return d; return `${Number(p[2])}. ${monShort()[Number(p[1])-1]} ${p[0]}`; }
function badgeFor(ev){const e=(ev||'').toUpperCase();if(e==='CLOSE_MAN')return 'bd-man';if(e==='OPEN')return 'bd-open';if(e==='CLOSE')return 'bd-close';if(e==='BLOCKED')return 'bd-block';if(e.indexOf('PROTECT')>=0)return 'bd-prot';if(['TEST','INFO','PROFILE'].includes(e))return 'bd-test';return 'bd-lock';}

const QS=new URLSearchParams(location.search);
const D=QS.get('d')||'';
const ACCT=QS.get('acct')||'';   // v0.38: multi-account — day view of the selected account
document.title=t('day.title',{date:D});
async function load(){
  let x; try{ x=await (await fetch('/day?d='+encodeURIComponent(D)+(ACCT?'&acct='+encodeURIComponent(ACCT):''))).json(); }catch(e){ $('dtitle').textContent=t('day.error'); return; }
  $('dtitle').textContent=fmtDay(x.date||D);
  const nv=$('net'); nv.textContent=eur(x.net||0); nv.className='v '+((x.net||0)>0.005?'pos':(x.net||0)<-0.005?'neg':'flat');
  $('k-trades').textContent=x.closes||0; $('k-wins').textContent=x.wins||0; $('k-losses').textContent=x.losses||0; $('k-blocks').textContent=x.blocks||0;
  // v0.45: mark manual trades on the target page (the calendar cell advertises "✋ N")
  const mk=$('k-manual'); if(mk){ mk.textContent=x.manual||0; mk.style.color=(x.manual||0)?'var(--amber)':'var(--txt3)'; }

  const rr=x.rules||[];
  $('rhead').style.display=rr.length?'block':'none';
  $('rules').innerHTML=rr.map(r=>{const m=ruleMeta(r.id);
    return `<div class="rcard"><div class="h"><span class="rid">${esc(r.id)}</span><span class="rn">${esc(m[0])}</span><span class="cnt">${r.count}×</span></div>
      <div class="ex">${esc(m[1])}</div></div>`;}).join('');

  const ev=x.events||[];
  const tl=$('tl');
  if(!ev.length){ tl.innerHTML=`<tr><td colspan="5" class="empty">${esc(t('day.events.empty'))}</td></tr>`; return; }
  tl.innerHTML=ev.map(r=>{const net=Number(r.net)||0;
    const nt=net!==0?`<span class="${net>0?'net-pos':'net-neg'}">${net>0?'+':''}${de(net)}</span>`:'<span style="color:var(--txt3)">—</span>';
    const time=(r.time||'').replace(/^\d{4}\.\d{2}\.\d{2}\s*/,'');
    const sym=r.symbol&&r.symbol!=='-'?r.symbol+(r.dir&&r.dir!=='-'?' '+r.dir:''):'';
    const isMan=(r.event||'').toUpperCase()==='CLOSE_MAN';
    // v0.73-fix: Zeit und Netto in einen LTR-Kontext. "21:52:31" ist drei
    //   Zahlengruppen mit Doppelpunkten - genau das Gebilde, das unter RTL kippt.
    return `<tr${isMan?' style="background:var(--amber-bg)"':''}><td class="num">${esc(time)}</td><td><span class="badge ${badgeFor(r.event)}">${isMan?esc(t('journal.badge.manual')):esc(r.event||'')}</span></td><td>${esc(sym)}</td><td class="num">${nt}</td>
      <td style="white-space:normal;color:var(--txt2)">${esc((r.tag||'').slice(0,80))}</td></tr>`;}).join('');
}
load();
</script>
</body>
</html>
