<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="trade.pageTitle">Mamal-Trading · Trade-Akte</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --card2:#fafafc;
    --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.05);
    --txt:#1d1d1f; --txt2:#6e6e73; --txt3:#86868b;
    --accent:#0071e3; --accent-bg:#e9f2fd;
    --green:#0a7d3c; --red:#d70015; --amber:#9a5b00;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Cascadia Mono',Consolas,monospace; --radius:14px;
  }
  html[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
    --txt:#f5f5f7; --txt2:#aeaeb2; --txt3:#8e8e93;
    --accent:#0a84ff; --accent-bg:#0a2642;
    --green:#30d158; --red:#ff453a; --amber:#ff9f0a;
    --shadow:0 1px 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 24px 70px}
  a{color:var(--accent);text-decoration:none;font-weight:600}
  .back{font-size:13px;color:var(--txt2);margin-bottom:12px}
  h2{font-size:10.5px;letter-spacing:.14em;color:var(--txt3);font-weight:700;
    margin:26px 2px 10px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .hero{padding:18px 20px;border-top:2px solid var(--accent)}
  .hero .t{font:700 20px/1.2 inherit}
  .hero .s{color:var(--txt2);font-size:13px;margin-top:3px}
  .hero .net{float:right;text-align:right}
  .hero .net .v{font:700 26px/1 var(--mono)}
  .pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;padding:4px 0}
  .kpi{padding:12px 18px;border-right:1px solid var(--line2)}
  .kpi:last-child{border-right:0}
  .kpi .l{font-size:10.5px;letter-spacing:.08em;color:var(--txt3);text-transform:uppercase}
  .kpi .v{font:700 19px/1.4 var(--mono);font-variant-numeric:tabular-nums}
  .sum{padding:16px 20px}
  .sum li{margin:6px 0;color:var(--txt2)}
  .sum li b{color:var(--txt)}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .shot{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .shot img{width:100%;display:block;cursor:zoom-in;background:var(--card2)}
  .shot .cap{padding:8px 12px;font-size:12px;color:var(--txt2);display:flex;gap:8px;align-items:center}
  .badge{font:700 10px/1 var(--mono);padding:3px 7px;border-radius:5px;letter-spacing:.05em}
  .b-open{background:var(--accent-bg);color:var(--accent)}
  .b-close{background:var(--line2);color:var(--txt2)}
  .b-move{background:rgba(240,173,62,.15);color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--txt3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
     padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:9px 14px;border-bottom:1px solid var(--line2);color:var(--txt2);
     font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer}tr.click:hover{background:var(--card2)}
  .mono{font-family:var(--mono)}
  .empty{padding:26px;text-align:center;color:var(--txt3)}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  #lb img{max-width:96vw;max-height:94vh}
</style>
</head>
<body>
<div class="wrap">
  <div class="back"><a href="/" data-i18n="nav.back">← zurück zum Cockpit</a></div>
  <div id="view"></div>
</div>
<div id="lb"><img id="lbimg" alt=""></div>
<script src="/i18n.js"></script>
<script src="/i18napply.js"></script>
<script>
// v0.73: `t` umbenannt -- i18napply.js bringt t() mit, eine lokale Variable
//   desselben Namens wuerde die Funktion in diesem Block verdecken.
(function(){ const saved=localStorage.getItem('mamalTheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=saved; })();
const $=id=>document.getElementById(id);
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESC[c]);
const eur=v=>(v>=0?'+':'−')+Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const Q=new URLSearchParams(location.search);
const ACCT=Q.get('acct')||localStorage.getItem('mamalAcct')||'';
const AQ=(x)=>{const p=[];if(ACCT)p.push('acct='+encodeURIComponent(ACCT));if(x)p.push(x);return p.length?'?'+p.join('&'):'';};
const KIND_CLS={open:'b-open',close:'b-close',slmove:'b-move',tpmove:'b-move'};
const kindLabel=k=>t('trade.kind.'+k)||String(k).toUpperCase();
// Die drei Drittel: kurz fuer die Liste (geteilt mit dem Dashboard), lang
//   fuer die Einzelansicht. Vorher waren das zwei verschieden HALB
//   uebersetzte Listen -- ['','early','mittig','late'] in der Liste und
//   ['','first third (early)','mittleres Drittel','last third (late)'] in
//   der Einzelansicht. Dieselben drei Drittel, zwei Sprachmischungen.
const third3      = () => ['', t('stats.third.early'), t('stats.third.mid'), t('stats.third.late')];
const third3long  = () => ['', t('trade.third.long.early'), t('trade.third.long.mid'), t('trade.third.long.late')];

// v0.65: only claim "offen" (open) when that is plausible. Up to EA v0.64 the close line carried no ticket,
//   so for older entries the result stays unassignable — which is something else than "still running".
// v0.73-fix: Der Parameter hiess `t` und verdeckte damit die Uebersetzer-
//   funktion t() IN DIESER Funktion. Das t('trade.net.unknown') darin rief
//   also eine Zeichenkette auf -> "t is not a function", die Trade-Liste
//   blieb LEER. Dieselbe Fehlerklasse wie die sechs verdeckten t im
//   Dashboard, nur als Parameter -- und darum von der Suche nach `const t=`
//   nicht gefunden. Der Browser hat es gefunden, nicht der Pruefer.
function netUnknown(when){
  const ts = when ? Date.parse(String(when).replace(/\./g,'-').replace(' ','T')) : NaN;
  return t((Number.isFinite(ts) && Date.now()-ts > 6*3600*1000) ? 'trade.net.unknown' : 'trade.net.open');
}
$('lb').onclick=()=>{$('lb').style.display='none'};
function zoom(src){ $('lbimg').src=src; $('lb').style.display='flex'; }

async function renderList(){
  let rows; try{ rows=await (await fetch('/trades'+AQ())).json(); }catch(e){ $('view').innerHTML=`<div class="empty">${esc(t('net.serverUnreachable'))}</div>`; return; }
  if(!rows.length){ $('view').innerHTML=`<h2>${esc(t('trade.h2.listPlain'))}</h2><div class="card empty">${esc(t('trade.list.empty'))}<br><small>${esc(t('trade.list.emptySub'))}</small></div>`; return; }
  const T3=third3(), C3=['','var(--green)','var(--amber)','var(--red)'];
  $('view').innerHTML=`<h2>${esc(t('trade.h2.list'))}</h2><div class="card"><table><thead><tr>`
    +`<th>${esc(t('journal.th.time'))}</th><th>${esc(t('journal.th.symbol'))}</th><th>${esc(t('trade.th.dir'))}</th>`
    +`<th>${esc(t('trade.th.candle'))}</th><th>${esc(t('trade.th.moved'))}</th><th>${esc(t('trade.th.images'))}</th>`
    +`<th>${esc(t('journal.th.net'))}</th></tr></thead><tbody>`
    +rows.map(r=>`<tr class="click" onclick="location.href='/trade.html${AQ('ticket='+r.ticket)}'">
        <td class="mono">${esc((r.time||'').slice(5,16))}</td><td>${esc(r.symbol||'')}</td><td>${esc(r.dir||'')}</td>
        <td style="color:${C3[r.third||0]}">${T3[r.third||0]||'—'}</td>
        <td${r.moves?' class="warn"':''}>${r.moves||'—'}</td><td>${r.shots||'—'}</td>
        <td class="${r.net==null?'':(r.net>=0?'pos':'neg')}" ${r.inferred?`title="${esc(t('trade.title.inferred'))}"`:(r.backfilled?`title="${esc(t('trade.title.backfilled'))}"`:'')}>${r.net==null?netUnknown(r.time):(r.inferred?'≈ ':'')+eur(r.net)}</td></tr>`).join('')
    +'</tbody></table></div>';
}

async function renderOne(ticket){
  let d; try{ d=await (await fetch('/trade'+AQ('ticket='+ticket))).json(); }catch(e){ $('view').innerHTML=`<div class="empty">${esc(t('net.serverUnreachable'))}</div>`; return; }
  if(!d.ok){ $('view').innerHTML=`<div class="card empty">${esc(d.error||t('trade.notFound'))}</div>`; return; }
  const o=d.open, s=d.stats;
  const netTxt=s.net==null?netUnknown(o?o.time:null):(s.inferred?'≈ ':'')+eur(s.net);
  const netCls=s.net==null?'':(s.net>=0?'pos':'neg');
  const T3=third3long();
  let h=`<div class="card hero">
      <div class="net"><div style="font-size:10.5px;letter-spacing:.08em;color:var(--txt3)">${esc(t('trade.result'))}</div>
        <div class="v ${netCls}">${netTxt}</div></div>
      <div class="t">${esc(o?o.dir:'')} ${esc(o?o.symbol:'')} · ${esc(t('trade.hero.ticket',{ticket:d.ticket}))}</div>
      <div class="s">${esc(o?o.time:'')}${o?esc(t('trade.hero.lotEntry',{lot:o.raw[9],price:o.raw[10]})):''}</div>
    </div>
    <h2>${esc(t('trade.h2.kpis'))}</h2>
    <div class="card kpis">
      <div class="kpi"><div class="l">${esc(t('trade.kpi.plannedRisk'))}</div><div class="v">${s.plannedRisk?s.plannedRisk.toFixed(2):'—'}</div></div>
      <div class="kpi"><div class="l">${esc(t('trade.th.moved'))}</div><div class="v ${s.moves?'warn':''}">${s.moves}</div></div>
      <div class="kpi"><div class="l">${esc(t('trade.kpi.riskier'))}</div><div class="v ${s.slWorse?'neg':''}">${s.slWorse}</div></div>
      <div class="kpi"><div class="l">${esc(t('trade.kpi.safer'))}</div><div class="v ${s.slBetter?'pos':''}">${s.slBetter}</div></div>
      <div class="kpi"><div class="l">${esc(t('trade.kpi.third'))}</div><div class="v" style="font-size:14px">${esc(T3[s.third||0]||'—')}</div></div>
    </div>
    <h2>${esc(t('trade.h2.summary'))}</h2>
    <div class="card sum"><ul>${d.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;

  if(d.shots.length){
    // Das Aufnahmedatum stand fest auf 'de-DE' und erschien so auch in der
    //   englischen und persischen Ansicht.
    const loc=LANG==='fa'?'fa-IR':LANG==='en'?'en-GB':'de-DE';
    h+=`<h2>${esc(t('trade.h2.shots'))}</h2><div class="shots">`
      +d.shots.map(sh=>{const lab=kindLabel(sh.kind), cls=KIND_CLS[sh.kind]||'b-close';
        const src='/shot/'+encodeURIComponent(sh.file)+AQ();
        return `<div class="shot"><img loading="lazy" src="${src}" onclick="zoom('${src}')" alt="${esc(lab)}">
          <div class="cap"><span class="badge ${cls}">${esc(lab)}</span>
          <span class="mono">${new Date(sh.ts*1000).toLocaleString(loc)}</span></div></div>`;}).join('')
      +'</div>';
  } else h+=`<h2>${esc(t('trade.h2.shotsPlain'))}</h2><div class="card empty">${esc(t('trade.shots.empty'))}<br><small>${esc(t('trade.shots.emptySub'))}</small></div>`;

  if(d.moves.length){
    h+=`<h2>${esc(t('trade.h2.moves'))}</h2><div class="card"><table><thead><tr>`
      +`<th>${esc(t('journal.th.time'))}</th><th>${esc(t('trade.th.sl'))}</th><th>${esc(t('trade.th.tp'))}</th>`
      +`<th>${esc(t('trade.th.rating'))}</th></tr></thead><tbody>`
      +d.moves.map(m=>{// v0.67: read the machine code; the German patterns remain only for journals written before v0.67.
        const bad=/^\[(SL_WORSE|SL_GONE|TP_SHORTER)\]/.test(m.tag||'')
                  || /ERHOEHT|unbegrenzt|abgekuerzt|abgekürzt/i.test(m.tag||'');
        return `<tr><td class="mono">${esc((m.time||'').slice(11))}</td><td class="mono">${esc(m.raw[11])}</td>
          <td class="mono">${esc(m.raw[12])}</td><td class="${bad?'neg':'pos'}">${esc(m.tag||'')}</td></tr>`;}).join('')
      +'</tbody></table></div>';
  }
  $('view').innerHTML=h;
}

const tk=Q.get('ticket');
if(tk) renderOne(tk.replace(/\D/g,'')); else renderList();
</script>
</body>
</html>
