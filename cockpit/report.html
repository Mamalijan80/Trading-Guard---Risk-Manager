<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mamal-Trading · Wochen-Report</title>
<style>
  :root{ --txt:#1d1d1f; --txt2:#6e6e73; --txt3:#86868b; --line:rgba(0,0,0,.09);
    --green:#0a7d3c; --red:#d70015; --amber:#9a5b00; --accent:#0071e3;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Cascadia Mono',Consolas,monospace; }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:800px;margin:0 auto;padding:34px 30px 60px}
  h1{font-size:21px;margin:0}
  h2{font-size:12px;letter-spacing:.12em;color:var(--txt3);text-transform:uppercase;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sub{color:var(--txt2);margin-top:4px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;margin-top:16px;overflow:hidden}
  .kpi{padding:12px 14px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi .l{font-size:10.5px;letter-spacing:.07em;color:var(--txt3);text-transform:uppercase}
  .kpi .v{font:700 19px/1.4 var(--mono)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--txt3);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:7px 10px;border-bottom:1px solid #f0f2f6;font-family:var(--mono);font-size:12.5px}
  .pos{color:var(--green)}.neg{color:var(--red)}
  .note{color:var(--txt2);font-size:13px;background:#f6f8fb;border-radius:9px;padding:12px 15px;margin-top:8px}
  .printbtn{position:fixed;top:16px;right:16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:9px 16px;font:600 13px/1 inherit}
  /* ==== v0.73: Rechts-nach-links (Persisch) ====
     Diese Seite hatte KEINE einzige RTL-Regel, obwohl applyI18n() ihr
     dir="rtl" setzt - die Sprache war da, das Layout nicht. Folge: Zahlen
     liefen im RTL-Fluss mit, und ein Gebilde aus zwei Zahlengruppen mit
     einem neutralen Trenner dazwischen kippt dabei. Aus "0 / 2" wurde auf
     dem Schirm "2 / 0" - im Wochen-Report waren alle vier Zeilen der Woche
     vertauscht, Siege als Niederlagen. Die Daten waren richtig, nur die
     Darstellung log.
     `isolate` statt `embed`: isolate kappt die Wechselwirkung mit dem
     umgebenden Text ganz, embed laesst sie teilweise zu. */
  html[dir="rtl"] table th,html[dir="rtl"] table td{text-align:right}
  html[dir="rtl"] .num,html[dir="rtl"] .mono,html[dir="rtl"] .v,
  html[dir="rtl"] .n,html[dir="rtl"] .cnt{direction:ltr;unicode-bidi:isolate}
  /* Der Druckknopf klebte fest an right:16px - unter RTL gehoert er nach links. */
  html[dir="rtl"] .printbtn{right:auto;left:16px}
  @media print{ .printbtn{display:none} body{font-size:12.5px} .wrap{padding:0} }
</style>
</head>
<body>
<button class="printbtn" onclick="window.print()" data-i18n="report.print">🖨 Drucken / als PDF sichern</button>
<div class="wrap">
  <h1 data-i18n="report.h1">Mamal-Trading · Wochen-Report</h1>
  <div class="sub" id="head" data-i18n="journal.loading">lade…</div>

  <div class="kpis" id="kpis"></div>

  <h2 data-i18n="report.h2.days">Letzte 7 aktive Handelstage</h2>
  <table><thead><tr><th data-i18n="report.th.day">Tag</th><th data-i18n="journal.th.net">Netto</th><th data-i18n="day.kpi.trades">Trades</th><th data-i18n="report.th.wl">G / V</th><th data-i18n="day.kpi.manual">davon manuell</th><th data-i18n="day.kpi.blocks">Regel-Blocks</th></tr></thead>
    <tbody id="days"></tbody></table>

  <h2 data-i18n="report.h2.rules">Regel-Eingriffe (gesamt)</h2>
  <table><thead><tr><th data-i18n="report.th.rule">Regel</th><th data-i18n="report.th.interventions">Eingriffe</th><th data-i18n="report.th.blockedEntry">am Einstieg blockiert</th><th data-i18n="report.th.closedTrades">Trades geschlossen</th></tr></thead>
    <tbody id="rules"></tbody></table>

  <h2 data-i18n="report.h2.verdict">Fazit</h2>
  <div class="note" id="fazit"></div>
</div>
<script src="/i18n.js"></script>
<script src="/i18napply.js"></script>
<script>
const $=id=>document.getElementById(id);
const de=(n,d=2)=>(n==null||isNaN(n))?'—':Number(n).toFixed(d).replace('.',',');
// v0.73-fix: Der Betrag kommt schon isoliert zurueck (U+2066/U+2069,
//   unsichtbar, in LTR wirkungslos). Ohne das wanderte unter RTL das
//   Vorzeichen ans andere Ende, sobald der Behaelter nicht zufaellig von
//   der CSS-Regel erfasst war - derselbe Betrag sah auf einer Seite an
//   zwei Stellen verschieden aus.
const eur=v=>ltr((v>=0?'+':'−')+'€'+Math.abs(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}));
const ESCMAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>ESCMAP[c]);
// v0.73: Das war die DRITTE Regelnamen-Tabelle im Projekt (Dashboard,
//   day.html, hier) -- und ihre Schreibweise wich schon ab: 'Risiko/Trade'
//   ohne Leerzeichen gegen 'Risiko / Trade' in den anderen beiden. Jetzt
//   kommt der Name aus ruleName() in i18napply.js, also aus einer Quelle.
const ACCT=new URLSearchParams(location.search).get('acct')||'';
const AQ=ACCT?('?acct='+encodeURIComponent(ACCT)):'';
async function load(){
  let a,s;
  try{ a=await (await fetch('/analytics'+AQ)).json(); s=(await (await fetch('/state'+AQ)).json()).state||{}; }
  catch(e){ $('head').textContent=t('net.serverUnreachable'); return; }
  const cal=a.calendar||{}; const dates=Object.keys(cal).sort();
  // v0.39-fix (Verify): first filter for ACTIVE days, THEN take the last 7 — otherwise plain
  // info/lock days eat up the slots and the report shows fewer than 7 trading days.
  const last7=dates.filter(d=>(cal[d].fills||0)+(cal[d].blocks||0)+(cal[d].closes||0)>0).slice(-7);
  const acct=s.account?t('acct.chip',{0:s.account}):'';
  // Das Erstelldatum stand fest auf 'de-DE'. Im englischen und persischen
  //   Report erschien damit ein deutsch formatiertes Datum.
  const loc=LANG==='fa'?'fa-IR':LANG==='en'?'en-GB':'de-DE';
  // v0.73-fix: Der Zeitraum sind ZWEI Daten mit einem Gedankenstrich dazwischen -
  //   dieselbe Falle wie bei G/V. Er wird darum als EIN Stueck zusammengebaut und
  //   isoliert eingesetzt, nicht als zwei Platzhalter.
  $('head').textContent=acct
    +(last7.length?t('report.head.span',{span:ltr(last7[0]+' – '+last7[last7.length-1])}):t('report.head.noDays'))
    +t('report.head.created',{when:ltr(new Date().toLocaleString(loc))});
  let net=0,tr=0,bl=0,w=0,l=0,f=0,man=0;
  for(const d of last7){ const c=cal[d]; net+=c.net||0; tr+=c.closes||0; bl+=c.blocks||0; w+=c.wins||0; l+=c.losses||0; f+=c.fills||0; man+=c.manual||0; }
  // v0.45-fix (Verify): discipline = panel trades/(panel trades+blocks) — identical to the dashboard.
  //   Before, `closes` fed into it, which since v0.44 also contains MANUAL trades: trading past the panel
  //   would have RAISED the discipline rate in the report.
  const disc=(f+bl)?Math.round(f/(f+bl)*100):0;
  $('kpis').innerHTML=
    `<div class="kpi"><div class="l">${esc(t('report.kpi.net'))}</div><div class="v ${net>=0?'pos':'neg'}">${eur(net)}</div></div>
     <div class="kpi"><div class="l">${esc(t('day.kpi.trades'))}</div><div class="v">${tr} <span style="font-size:12px;color:var(--txt3)">${esc(t('stats.winLoss',{w:w,l:l}))}${man?esc(t('report.manualSuffix',{n:man})):''}</span></div></div>
     <div class="kpi"><div class="l">${esc(t('day.kpi.blocks'))}</div><div class="v">${bl}</div></div>
     <div class="kpi"><div class="l">${esc(t('hero.discipline'))}</div><div class="v">${disc}%</div></div>`;
  $('days').innerHTML=last7.map(d=>{ const c=cal[d];
    // v0.73-fix: class="num" auf JEDE Zahlenspalte. Ohne das drehte die
    //   Spalte "G / V" unter RTL - 5 Siege und 0 Verluste erschienen als
    //   "0 / 5". Das Datum ebenso: auch 2026.11.06 ist ein Zahlengebilde.
    return `<tr><td class="num">${esc(d)}</td><td class="num ${(c.net||0)>=0?'pos':'neg'}">${eur(c.net||0)}</td><td class="num">${c.closes||0}</td><td class="num">${c.wins||0} / ${c.losses||0}</td><td class="num"${c.manual?' style="color:var(--amber);font-weight:700"':''}>${c.manual||0}</td><td class="num">${c.blocks||0}</td></tr>`; }).join('')
    || `<tr><td colspan="6" style="color:var(--txt3)">${esc(t('report.days.empty'))}</td></tr>`;
  $('rules').innerHTML=(a.rules||[]).map(r=>
    `<tr><td>${esc(r.id)} · ${esc(ruleName(r.id))}</td><td class="num">${r.count}×</td><td class="num">${r.blocked||0}×</td><td class="num">${r.closed||0}×</td></tr>`).join('')
    || `<tr><td colspan="4" style="color:var(--txt3)">${esc(t('report.rules.empty'))}</td></tr>`;
  const top=(a.rules||[])[0];
  // v0.45-fix (Verify): "sehr diszipliniert" (very disciplined) must NOT appear when trading happened past the panel —
  //   no rule applies there, so there cannot be any blocks either.
  // v0.73: Dieser Satz sprach zwei Sprachen gleichzeitig -- deutsche Anfaenge
  //   ("Positive Woche. ", "Kein einziger Regel-Block ...") und englische Mitte
  //   ("a rule stopped you", "Every block was a moment where ...", "Plan FEWER
  //   attempts for next week"). Im gedruckten Report stand das so auf dem Papier.
  $('fazit').textContent=
    t(net>=0?'report.verdict.positive':'report.verdict.negative')
    +(bl===0
        ? (man===0 ? t('report.verdict.clean')
                   : t('report.verdict.cleanButManual',{n:man}))
        : t('report.verdict.blocks',{n:bl,
            top:top?t('report.verdict.topRule',{id:top.id,name:ruleName(top.id)}):''}))
    +(man>0&&bl>0?t('report.verdict.alsoManual',{n:man}):'')
    +(disc>0&&disc<40?t('report.verdict.fewerAttempts'):'');
}
load();
</script>
</body>
</html>
